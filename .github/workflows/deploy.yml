name: Deploy CMS Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/elitepicco/public_html/cms.elitepic.co.uk

            git config --global --add safe.directory /home/elitepicco/public_html/cms.elitepic.co.uk

            git fetch origin
            git reset --hard origin/main
            git clean -fd

            npm ci

            sed -i 's#../Notifications/NotificationDropdown#../notifications/NotificationDropdown#g' src/components/admin/AdminLayout.jsx

            npm run build
